<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEZONE 🔥🎮</title>
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- ESTILO GERAL (DARK MODE + NEON) --- */
        :root {
            --primary: #ff003c;
            --dark: #0a0a0a;
            --card-bg: #161616;
            --text: #ffffff;
            --gray: #b3b3b3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--dark);
            color: var(--text);
            scroll-behavior: smooth;
        }

        h1, h2, h3, .logo { font-family: 'Rajdhani', sans-serif; text-transform: uppercase; }

        /* Botões */
        .btn {
            padding: 12px 24px; background: transparent; border: 2px solid var(--primary);
            color: var(--text); font-weight: bold; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px; display: inline-block;
        }
        .btn:hover { background: var(--primary); box-shadow: 0 0 15px var(--primary); }
        .btn-primary { background: var(--primary); border: none; }
        .btn-primary:hover { background: #fff; color: var(--primary); }
        .btn-small { padding: 5px 10px; font-size: 0.8rem; }

        /* Header */
        header {
            background: rgba(10, 10, 10, 0.98); padding: 20px 0; position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid #333;
        }
        .nav-flex { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .logo { font-size: 2rem; font-weight: 700; color: var(--primary); cursor: pointer;}
        .nav-links button {
            background: none; border: none; color: white; margin-left: 20px;
            font-size: 1rem; cursor: pointer; transition: 0.3s;
        }
        .nav-links button:hover { color: var(--primary); }
        .cart-icon { position: relative; }
        .cart-count { 
            position: absolute; top: -10px; right: -10px; background: var(--primary); 
            font-size: 0.7rem; padding: 2px 6px; border-radius: 50%; 
        }

        /* Hero Section */
        .hero {
            height: 80vh; display: flex; align-items: center; justify-content: center; text-align: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1542751371-adc38448e05e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover; background-position: center;
        }
        .hero h1 { font-size: 4rem; margin-bottom: 20px; line-height: 1; }
        .hero span { color: var(--primary); }
        .hero p { font-size: 1.2rem; color: var(--gray); margin-bottom: 30px; }

        /* Produtos */
        .products-section { padding: 80px 0; max-width: 1200px; margin: 0 auto; }
        .section-title { text-align: center; margin-bottom: 50px; font-size: 2.5rem; }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px;
        }
        .card {
            background: var(--card-bg); border: 1px solid #333; border-radius: 10px;
            overflow: hidden; transition: 0.3s; position: relative;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 20px; }
        .price { color: var(--primary); font-size: 1.5rem; font-weight: bold; display: block; margin: 10px 0; }

        /* MODAIS (JANELAS) - CORRIGIDO PARA FUNCIONAR SEMPRE */
        .modal-overlay {
            display: none; /* Escondido por padrão */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center; align-items: center;
            z-index: 2000;
        }
        
        /* Classe que o JS vai adicionar para mostrar */
        .modal-overlay.active { 
            display: flex !important; 
        }

        .modal-content {
            background: var(--card-bg); padding: 40px; border-radius: 10px;
            width: 90%; max-width: 400px; border: 1px solid var(--primary);
            position: relative; box-shadow: 0 0 20px rgba(255,0,60,0.3);
        }
        .close-modal { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 1.5rem; color: var(--gray); }
        .close-modal:hover { color: var(--primary); }
        
        input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #222; border: 1px solid #444; color: white; border-radius: 5px;
        }
        input:focus { outline: none; border-color: var(--primary); }
        
        /* Utilitários Modal */
        .modal-title { text-align: center; margin-bottom: 20px; color: var(--primary); }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .total-price { font-size: 1.2rem; font-weight: bold; margin-top: 20px; text-align: right; color: var(--primary); }

        /* Footer */
        footer { background: #050505; padding: 40px 0; text-align: center; border-top: 1px solid #333; margin-top: 50px; }
        
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .nav-flex { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <!-- Navegação -->
    <header>
        <div class="nav-flex">
            <div class="logo" onclick="location.reload()"><i class="fas fa-gamepad"></i> GAMEZONE</div>
            <nav class="nav-links">
                <button onclick="scrollToSection('home')">Início</button>
                <button onclick="scrollToSection('products')">Loja</button>
                <button id="loginBtn"><i class="fas fa-user"></i> Login</button>
                <span id="userBadge" style="display:none; margin-left: 20px; color: var(--primary);">Olá, Gamer!</span>
                <button class="cart-icon" onclick="toggleModal('cartModal')">
                    <i class="fas fa-shopping-cart"></i> Carrinho
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="container">
            <h1>SEU GAME, <br><span>SUA ESCOLHA!</span></h1>
            <p>A loja mais moderna para gamers exigentes.</p>
            <button class="btn btn-primary" onclick="scrollToSection('products')">VER LOJA</button>
        </div>
    </section>

    <!-- Loja -->
    <section id="products" class="products-section container">
        <h2 class="section-title">Destaques 🔥</h2>
        <div class="grid" id="productGrid">
            <!-- Preenchido via JS -->
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <h2>GAMEZONE</h2>
            <p>&copy; 2026 Gamezone Store. Todos os direitos reservados.</p>
        </div>
    </footer>

    <!-- MODAL LOGIN -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" onclick="toggleModal('loginModal')">&times;</span>
            <h2 class="modal-title">Entrar</h2>
            <form onsubmit="handleLogin(event)">
                <input type="email" id="email" placeholder="Seu Email" required value="cliente@teste.com">
                <input type="password" id="pass" placeholder="Sua Senha" required value="123456">
                <button type="submit" class="btn btn-primary" style="width:100%">ENTRAR</button>
            </form>
        </div>
    </div>

    <!-- MODAL CARRINHO -->
    <div id="cartModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" onclick="toggleModal('cartModal')">&times;</span>
            <h2 class="modal-title">Seu Carrinho 🛒</h2>
            <div id="cartItemsContainer">
                <p style="text-align:center; color:#666;">Carrinho vazio</p>
            </div>
            <div class="total-price">Total: R$ <span id="cartTotal">0,00</span></div>
            <button class="btn btn-primary" style="width:100%; margin-top:20px;" onclick="checkout()">Finalizar com Pix</button>
        </div>
    </div>

    <script>
        // --- DADOS DOS PRODUTOS ---
        const products = [
            { id: 1, name: "Cyber Adventure 2077", price: 199.90, img: "https://images.unsplash.com/photo-1542751371-adc38448e05e?w=500" },
            { id: 2, name: "Space Warrior V", price: 249.90, img: "https://images.unsplash.com/photo-1552820728-8b81321e8f85?w=500" },
            { id: 3, name: "Racing Legends", price: 149.90, img: "https://images.unsplash.com/photo-1511512578047-dfb3cb71df04?w=500" },
            { id: 4, name: "Fantasy Quest RPG", price: 299.90, img: "https://images.unsplash.com/photo-1538481199705-c710c4e956fc?w=500" },
            { id: 5, name: "Zombie Survival", price: 179.90, img: "https://images.unsplash.com/photo-1509198397267-3138795292d2?w=500" },
            { id: 6, name: "FIFA Ultimate 26", price: 349.90, img: "https://images.unsplash.com/photo-1493711662012-f5bd2154c35f?w=500" }
        ];

        let cart = [];

        // --- INICIALIZAÇÃO ---
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            
            // Adiciona evento de clique no botão Login
            document.getElementById('loginBtn').addEventListener('click', () => {
                toggleModal('loginModal');
            });
        });

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => `
                <div class="card">
                    <img src="${p.img}" alt="${p.name}">
                    <div class="card-body">
                        <h3>${p.name}</h3>
                        <span class="price">R$ ${p.price.toFixed(2)}</span>
                        <button class="btn btn-small" onclick="addToCart(${p.id})">
                            <i class="fas fa-cart-plus"></i> Adicionar
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // --- SISTEMA DE MODAIS (CORREÇÃO PRINCIPAL) ---
        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal.classList.contains('active')) {
                modal.classList.remove('active');
            } else {
                modal.classList.add('active');
            }
        }

        // Fechar modais ao clicar fora (no fundo escuro)
        window.onclick = function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.classList.remove('active');
            }
        }

        // --- LÓGICA DO CARRINHO ---
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCartUI();
            
            // Feedback visual rápido
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Adicionado';
            setTimeout(() => btn.innerHTML = originalText, 1000);
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            
            const container = document.getElementById('cartItemsContainer');
            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#666;">Carrinho vazio</p>';
                document.getElementById('cartTotal').innerText = '0,00';
            } else {
                container.innerHTML = cart.map((item, index) => `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <span>R$ ${item.price.toFixed(2)} <i class="fas fa-trash" style="color:red; cursor:pointer; margin-left:10px;" onclick="removeFromCart(${index})"></i></span>
                    </div>
                `).join('');
                
                const total = cart.reduce((sum, item) => sum + item.price, 0);
                document.getElementById('cartTotal').innerText = total.toFixed(2);
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function checkout() {
            if(cart.length === 0) return alert("Seu carrinho está vazio!");
            alert("Redirecionando para o Pix...");
            cart = [];
            updateCartUI();
            toggleModal('cartModal');
        }

        // --- LÓGICA DE LOGIN ---
        function handleLogin(e) {
            e.preventDefault();
            alert("Login realizado com sucesso! Bem-vindo.");
            document.getElementById('userBadge').style.display = 'inline';
            toggleModal('loginModal');
        }

        function scrollToSection(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
